name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build shared test container
        run: docker build --file Dockerfile.ci --tag classification-tests:ci .
      - name: Lint desktop and backend
        run: docker run --rm classification-tests:ci npm run lint
      - name: Check formatting
        run: docker run --rm classification-tests:ci npm run format:check
      - name: Run all tests in the same container
        # The image contains the committed metrics; keep only the header so the CSV holds rows from this run
        run: >
          docker run --name classification-tests classification-tests:ci
          sh -c 'head -n 1 test-metrics.csv > test-metrics.tmp && mv test-metrics.tmp test-metrics.csv && exec npm test'
      - name: Publish test coverage summary
        if: always()
        run: |
          # test-metrics.csv from the checkout lists every suite; the container copy holds only rows produced by this run
          docker cp classification-tests:/app/test-metrics.csv fresh-metrics.csv || : > fresh-metrics.csv
          {
            echo '### Test coverage'
            echo
            echo '| Part | Tests | Coverage |'
            echo '| --- | --- | --- |'
            awk -F, '
              FILENAME == ARGV[1] { if (FNR > 1) fresh[$1] = $2 " | " $3; next }
              FNR > 1 { print "| " $1 " | " (($1 in fresh) ? fresh[$1] : "skipped | skipped") " |" }
            ' fresh-metrics.csv test-metrics.csv
          } >> "$GITHUB_STEP_SUMMARY"

  schema:
    name: GraphQL schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Regenerate the schema files
        run: |
          npm run emit:schema --workspace backend
          npm run sync:schema --workspace desktop
      - name: Fail if the committed schema files are stale
        run: git diff --exit-code -- backend/schema.gql desktop/schema.graphql

  container-build:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: aws-jobs
            context: aws-jobs
            dockerfile: aws-jobs/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Build image without publishing
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.image }}:ci" "${{ matrix.context }}"

  windows-installer:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and generate GraphQL types
        run: npm ci
      - name: Build Windows x64 installer
        run: npm run make --workspace desktop -- --platform win32 --arch x64
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x64
          path: desktop/out/make/squirrel.windows/x64/*
          if-no-files-found: error
          retention-days: 14

  ci-passed:
    name: CI passed
    if: always()
    needs: [tests, schema, container-build, windows-installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          TESTS: ${{ needs.tests.result }}
          SCHEMA: ${{ needs.schema.result }}
          CONTAINERS: ${{ needs.container-build.result }}
          WINDOWS: ${{ needs.windows-installer.result }}
        run: |
          for result in "$TESTS" "$SCHEMA" "$CONTAINERS" "$WINDOWS"; do
            if [ "$result" != success ]; then
              echo "A required check finished with status: $result"
              exit 1
            fi
          done
