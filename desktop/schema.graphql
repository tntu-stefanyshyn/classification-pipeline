  experiments: [Experiment!]!

  """
  Liveness check. Returns `ok` while the backend runs. Needs no authentication.
  """
  health: String!

  """The user of the access token. Needs a signed-in user."""
  me: User!

  """
  Runs the optimization of an experiment and returns the best pipeline. Allowed when the experiment is `computing` or `completed` and every pipeline is `completed`, and as a retry when the experiment is already in `optimization` but its optimization status is no longer `optimizing` (for example `failed`): the container then runs again without a status transition. The call returns only when the optimization has finished. Owner only.
  """
  optimizeExperimentRuns(
    """Id of the experiment."""
    experimentId: ID!
  ): OptimizationResult!

  """One pipeline by id. Owner or worker."""
  pipeline(
    """Id of the pipeline."""
    pipelineId: ID!
  ): Pipeline

  """
  The pipelines of an experiment, optionally of one queue. Owner or worker.
  """
  pipelines(
    """Id of the experiment."""
    experimentId: ID!

    """Return only the pipelines of this queue."""
    queue: ComputationQueue
  ): [Pipeline!]!

  """Version, status and uptime of the backend. Needs no authentication."""
  serverInfo: ServerInfo!

  """
  A presigned `GET` URL for the dataset of a file record. Allowed for its uploader or a worker (service token).
  """
  signedDownloadUrl(
    """Id of the file record."""
    fileId: ID!
  ): SignedUploadUrl!

  """
  A presigned `PUT` URL for uploading a CSV file straight to S3. The key is issued under the signed-in user's prefix.
  """
  signedUploadUrl(
    """File name and optional MIME type."""
    input: SignedUploadRequest!
  ): SignedUploadUrl!

  """The catalog of technologies that can be used as graph nodes."""
  technologies: [Technology!]!

  """
  The experiments that use a file and whether deleting it is blocked. Owner of the file only.
  """
  uploadedFileUsage(
    """Id of the file."""
    _id: ID!
  ): UploadedFileUsage!

  """The files of the signed-in user, newest first."""
  uploadedFiles: [UploadedFile!]!
}

"""Data for creating an account."""
input RegisterInput {
  """Email address. It must not be registered yet."""
  email: String!

  """Optional display name."""
  name: String

  """Password of the new account."""
  password: String!
}

"""State of the running backend."""
type ServerInfo {
  """Always `ok` while the backend answers."""
  status: String!

  """Seconds since the backend started."""
  uptimeSeconds: Int!

  """Version from `package.json`, or `dev` when it is unknown."""
  version: String!
}

"""Request for a presigned upload URL."""
input SignedUploadRequest {
  """Name of the file to upload; it must end with `.csv`."""
  filename: String!

  """
  MIME type of the file; one of `text/csv`, `application/vnd.ms-excel`, `text/plain`.
  """
  mimeType: String
}

"""A presigned S3 URL."""
type SignedUploadUrl {
  """Seconds until the URL expires (`AWS_S3_PRESIGN_EXPIRES`)."""
  expiresIn: Int!

  """The S3 key of the object."""
  key: String!

  """
  The presigned URL. Upload with `PUT`; when a `mimeType` was requested, send it as the `Content-Type`.
  """
  url: String!
}

"""Request to stop a run."""
input StopExperimentRunInput {
  """Id of the pipeline to stop."""
  runId: ID!
}

"""A technology of the catalog that can be a node of a graph."""
type Technology {
  """Id of the technology."""
  _id: ID!

  """Name shown to users."""
  displayName: String

  """Unique name; graph nodes refer to it."""
  name: String!

  """Settings that can be configured for the technology."""
  settings: [TechnologySetting!]!

  """The stage the technology belongs to."""
  stage: ClassificationStage!
}

"""A configurable setting of a technology."""
type TechnologySetting {
  """Value used when none is given."""
  defaultValue: String

  """Key used in `GraphNodeSetting.key`."""
  key: String!

  """Name shown to users."""
  label: String!

  """Allowed values of a `SELECT` setting."""
  options: [String!]

  """Hint shown in an empty input."""
  placeholder: String

  """Whether a value is required."""
  required: Boolean

  """Kind of the value."""
  type: TechnologySettingType!
}

"""Kind of value of a technology setting."""
enum TechnologySettingType {
  """Yes or no."""
  BOOLEAN

  """A number."""
  NUMBER

  """One of the listed options."""
  SELECT

  """Free text."""
  TEXT
}

"""Changes to an experiment. Send only the fields to change."""
input UpdateExperimentInput {
  """Id of the experiment."""
