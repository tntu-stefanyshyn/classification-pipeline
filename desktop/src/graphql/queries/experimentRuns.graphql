query ExperimentRuns($experimentId: ID!, $queue: ComputationQueue) {
  experimentRuns(experimentId: $experimentId, queue: $queue) {
    _id
    experimentId
    queue
    status
    progress
    statusMessage
    history {
      message
      createdAt
    }
    pathNodes {
      _id
      label
    }
    pathNodeIds
    createdAt
    updatedAt
  }
}
