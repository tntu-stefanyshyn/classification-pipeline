[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-jobs"
version = "0.1.0"
description = "AWS ML jobs workspace for classification tasks"
authors = [{ name = "ivans" }]
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.35,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "numpy>=1.26,<3",
  "joblib>=1.4,<2",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "moto>=5.0,<6"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
