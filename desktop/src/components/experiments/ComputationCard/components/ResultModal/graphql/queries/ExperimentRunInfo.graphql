query PipelineInfo($pipelineId: ID!) {
  pipeline(pipelineId: $pipelineId) {
    _id
    status
    updatedAt
    queue
    statusMessage
    progress
    machineInfo {
      hostname
      cpuModel
      gpuModel
      memoryGb
      cores
      platform
      arch
      release
      appVersion
      queue
      lastSeenAt
    }
    computingResult {
      accuracyScores
      duration
      f1Scores
      rocAucScores
      sampleCount
      channelNames
    }
    pathNodes {
      _id
      label
    }
    history {
      createdAt
      message
    }
  }
}
