mutation UpdateExperiment($input: UpdateExperimentInput!) {
  updateExperiment(input: $input) {
    _id
    name
    description
    fileId
    status
    createdAt
    graph {
      _id
      computationMode
      experimentId
      createdAt
      nodes {
        _id
        label
        stage
        technology
        type
        settings {
          key
          value
        }
        parentId
      }
    }
  }
}
