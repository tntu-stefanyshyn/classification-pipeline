name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Tests (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, desktop]
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and generate GraphQL types
        run: npm ci
      - name: Run tests
        run: npm run test --workspace ${{ matrix.workspace }}

  python-tests:
    name: Tests (aws-jobs)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aws-jobs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: aws-jobs/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest

  container-build:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: aws-jobs
            context: aws-jobs
            dockerfile: aws-jobs/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Build image without publishing
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.image }}:ci" "${{ matrix.context }}"

  windows-installer:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and generate GraphQL types
        run: npm ci
      - name: Build Windows x64 installer
        run: npm run make --workspace desktop -- --platform win32 --arch x64
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x64
          path: desktop/out/make/squirrel.windows/x64/*
          if-no-files-found: error
          retention-days: 14

  ci-passed:
    name: CI passed
    if: always()
    needs: [node-tests, python-tests, container-build, windows-installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          NODE_TESTS: ${{ needs.node-tests.result }}
          PYTHON_TESTS: ${{ needs.python-tests.result }}
          CONTAINERS: ${{ needs.container-build.result }}
          WINDOWS: ${{ needs.windows-installer.result }}
        run: |
          for result in "$NODE_TESTS" "$PYTHON_TESTS" "$CONTAINERS" "$WINDOWS"; do
            if [ "$result" != success ]; then
              echo "A required check finished with status: $result"
              exit 1
            fi
          done
