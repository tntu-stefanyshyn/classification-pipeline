query PipelineInfo($pipelineId: ID!) {
  pipeline(pipelineId: $pipelineId) {
    _id
    status
    updatedAt
    queue
    statusMessage
    progress
    computingResult {
      accuracyScores
      duration
      f1Scores
      rocAucScores
      sampleCount
      channelNames
    }
    pathNodes {
      _id
      label
    }
    history {
      createdAt
      message
    }
  }
}
