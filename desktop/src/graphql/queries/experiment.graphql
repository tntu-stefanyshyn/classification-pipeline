query Experiment($_id: ID!) {
  experiment(_id: $_id) {
    _id
    name
    description
    status
    createdAt
    graph {
      _id
      experimentId
      createdAt
      nodes {
        _id
        label
        stage
        technology
        type
        settings {
          key
          value
        }
        parentId
      }
    }
  }
}
