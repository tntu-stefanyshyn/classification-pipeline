schema {
  query: Query
  mutation: Mutation
}

type Query {
  serverInfo: ServerInfo!
}

type Mutation {
  login(input: LoginInput!): AuthPayload!
  register(input: RegisterInput!): AuthPayload!
}

type ServerInfo {
  version: String!
  status: String!
  uptimeSeconds: Int!
}

type User {
  id: ID!
  email: String!
  name: String
  createdAt: String
  updatedAt: String
}

type AuthPayload {
  token: String!
  user: User!
}

input LoginInput {
  email: String!
  password: String!
}

input RegisterInput {
  email: String!
  password: String!
  name: String
}
